{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>{% block title %}{% endblock title %}</title>

	<link rel="shortcut icon" href="{% static 'icons/favicon.ico' %}" type="image/x-icon">
	<link rel="stylesheet" href="{% static 'styles/styles.css' %}">

	{% block styles %}{% endblock styles %}
</head>

<body>
	<header>
		<h1>Welcome</h1>
		<nav>
			<form action="{% url 'search' %}">
				<input type="text" name="query" {% if request.get_search_query %} value="{{request.get_search_query}}"
					{% endif %} required>
				<select name="provider" required>
					<option value="anime" {% if request.get_provider == "anime" %}selected{% endif %}>Anime</option>
					<option value="manga" {% if request.get_provider == "manga" %}selected{% endif %}>Manga</option>
					<option value="novels" {% if request.get_provider == "novels" %}selected{% endif %}>Novels</option>
				</select>
				<button type="submit">Go</button>
			</form>
		</nav>

		{% include "base/components/news_feed.html" %}
	</header>

	<main>
		{% block content %}{% endblock content %}
	</main>

	<footer>
		Akash Damle, 2024.
	</footer>

	<script>
		const imagePlaceholder = "{% static 'images/placeholder.jpg' %}"
		const nowPlaying = "{{request.get_now_playing}}"
	</script>

	<script src="{% static 'scripts/app.js' %}"></script>
	{% block scripts %}{% endblock scripts %}
</body>

</html>
